name: tvOS Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build AuraTV (tvOS)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest Xcode 26
        run: |
          ls -d /Applications/Xcode*.app || true
          XCODE_APP=$(ls -d /Applications/Xcode*26*.app 2>/dev/null | sort | tail -n 1 || true)
          if [ -z "$XCODE_APP" ]; then
            echo "::error::Xcode 26 is required by AetherEngine 7.47.0 (tvOS 26.0 SDK), but no Xcode 26 app was found in /Applications."
            exit 1
          fi
          echo "Selecting Xcode: $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"

      - name: Check Xcode environment & schemes
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          xcodebuild -project AuraTV.xcodeproj -list

      - name: Resolve Swift Package Manager dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project AuraTV.xcodeproj \
            -scheme AuraTV \
            -destination 'generic/platform=tvOS'

      - name: Build AuraTV for tvOS (Release, unsigned)
        run: |
          SYMROOT_DIR="$PWD/build/ReleaseSym"
          BUILD_OUT_DIR="$SYMROOT_DIR/Release-appletvos"
          xcodebuild build \
            -project AuraTV.xcodeproj \
            -scheme AuraTV \
            -configuration Release \
            -destination 'generic/platform=tvOS' \
            SYMROOT="$SYMROOT_DIR" \
            CONFIGURATION_BUILD_DIR="$BUILD_OUT_DIR" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          echo "SYMROOT_DIR=$SYMROOT_DIR" >> $GITHUB_ENV
          echo "BUILD_OUT_DIR=$BUILD_OUT_DIR" >> $GITHUB_ENV

      - name: Package unsigned AuraTV.ipa
        run: |
          APP_PATH="$BUILD_OUT_DIR/AuraTV.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find "$SYMROOT_DIR" -name 'AuraTV.app' -type d | head -n 1 || true)
          fi
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "::error::Built AuraTV.app not found under $SYMROOT_DIR"
            exit 1
          fi

          echo "Packaging app bundle: $APP_PATH"
          ls -la "$APP_PATH"
          ls -la "$APP_PATH/Frameworks" || true
          ls -la "$APP_PATH/PlugIns" || true

          if [ ! -s "$APP_PATH/Assets.car" ]; then
            echo "::error::Compiled Assets.car missing from $APP_PATH"
            exit 1
          fi
          if [ ! -d "$APP_PATH/PlugIns/AuraTVTopShelf.appex" ]; then
            echo "::error::Embedded AuraTVTopShelf.appex missing from $APP_PATH/PlugIns"
            exit 1
          fi

          rm -rf ipa_staging AuraTV.ipa
          mkdir -p ipa_staging/Payload
          ditto "$APP_PATH" ipa_staging/Payload/AuraTV.app
          (cd ipa_staging && zip -r -y ../AuraTV.ipa Payload)

          if [ ! -s AuraTV.ipa ]; then
            echo "::error::AuraTV.ipa is missing or empty"
            exit 1
          fi

          ls -lh AuraTV.ipa
          unzip -l AuraTV.ipa | grep -E 'Assets\.car|AuraTVTopShelf\.appex' || true
          unzip -l AuraTV.ipa | head -n 45

      - name: Upload AuraTV.ipa as artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraTV-tvOS-IPA
          path: AuraTV.ipa
          if-no-files-found: error
          retention-days: 30

