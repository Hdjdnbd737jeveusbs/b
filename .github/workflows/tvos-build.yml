name: tvOS Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build AuraTV (tvOS)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Xcode environment & schemes
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          xcodebuild -project AuraTV.xcodeproj -list

      - name: Resolve Swift Package Manager dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project AuraTV.xcodeproj \
            -scheme AuraTV \
            -destination 'generic/platform=tvOS'

      - name: Build AuraTV for tvOS
        run: |
          xcodebuild build \
            -project AuraTV.xcodeproj \
            -scheme AuraTV \
            -destination 'generic/platform=tvOS' \
            CODE_SIGNING_ALLOWED=NO

  screenshots:
    name: Simulator Screenshots (tvOS)
    runs-on: macos-15
    timeout-minutes: 45
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Swift Package Manager dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project AuraTV.xcodeproj \
            -scheme AuraTV \
            -destination 'platform=tvOS Simulator,name=Apple TV 4K (3rd generation)'

      - name: Build AuraTV for tvOS Simulator
        run: |
          xcodebuild build \
            -project AuraTV.xcodeproj \
            -scheme AuraTV \
            -destination 'platform=tvOS Simulator,name=Apple TV 4K (3rd generation)' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Find simulator runtime & boot Apple TV 4K
        run: |
          # List available tvOS simulator runtimes
          xcrun simctl list runtimes
          xcrun simctl list devices

          # Pick the first available Apple TV 4K simulator device
          DEVICE_UDID=$(xcrun simctl list devices available -j \
            | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          for runtime, devices in d['devices'].items():
              if 'tvOS' not in runtime:
                  continue
              for dev in devices:
                  if 'Apple TV 4K' in dev['name'] and dev['isAvailable']:
                      print(dev['udid'])
                      exit()
          " 2>/dev/null || echo "")

          if [ -z "$DEVICE_UDID" ]; then
            # Create one if none found
            RUNTIME=$(xcrun simctl list runtimes -j \
              | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          for r in reversed(d['runtimes']):
              if 'tvOS' in r.get('name','') and r.get('isAvailable', False):
                  print(r['identifier'])
                  exit()
          ")
            echo "Creating Apple TV 4K simulator on runtime $RUNTIME"
            DEVICE_UDID=$(xcrun simctl create 'AuraTV-CI-TV' \
              'com.apple.CoreSimulator.SimDeviceType.Apple-TV-4K-3rd-generation-4K' \
              "$RUNTIME")
          fi

          echo "Using simulator UDID: $DEVICE_UDID"
          echo "DEVICE_UDID=$DEVICE_UDID" >> $GITHUB_ENV

          # Boot the simulator
          xcrun simctl boot "$DEVICE_UDID" || true
          # Wait until booted
          until xcrun simctl list devices | grep "$DEVICE_UDID" | grep -q Booted; do
            echo "Waiting for simulator to boot..."
            sleep 3
          done
          echo "Simulator booted."

      - name: Locate built .app bundle
        run: |
          APP_PATH=$(find build/DerivedData -name 'AuraTV.app' \
            -path '*iphonesimulator*' -o \
            -name 'AuraTV.app' -path '*appletvsimulator*' \
            | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build/DerivedData -name 'AuraTV.app' | head -n 1)
          fi
          echo "App bundle: $APP_PATH"
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV

      - name: Install AuraTV on simulator
        run: |
          xcrun simctl install "$DEVICE_UDID" "$APP_PATH"

      - name: Launch AuraTV and capture screenshots
        run: |
          mkdir -p screenshots

          # Get the app's bundle ID from Info.plist
          BUNDLE_ID=$(defaults read "$APP_PATH/Info.plist" CFBundleIdentifier 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist")
          echo "Bundle ID: $BUNDLE_ID"

          # -----------------------------------------------------------------
          # Sidebar navigation strategy for tvOS 18 .sidebarAdaptable TabView
          #
          # The sidebar is a vertical list. When content is focused the sidebar
          # collapses; pressing `menu` returns focus to the sidebar. We then
          # press `down` once to highlight the next tab and `select` to enter it.
          # For Search (which is ABOVE Home in the tab order) we press `up`.
          #
          # Key codes accepted by `xcrun simctl io booted sendkey`:
          #   up / down / left / right / select / menu / play / back
          # -----------------------------------------------------------------

          sidebar_nav() {
            local direction="$1"   # "up" or "down"
            local label="$2"
            local file="$3"
            # Return focus to the sidebar
            xcrun simctl io booted sendkey menu 2>/dev/null || true
            sleep 1
            # Move highlight within sidebar
            xcrun simctl io booted sendkey "$direction" 2>/dev/null || true
            sleep 0.5
            # Confirm selection (open the tab's content)
            xcrun simctl io booted sendkey select 2>/dev/null || true
            # Wait for TMDB network images to render
            sleep 4
            xcrun simctl io booted screenshot "$file"
            echo "Captured $label -> $file"
          }

          # Launch the app and wait for TMDB home posters to load
          xcrun simctl launch booted "$BUNDLE_ID"
          sleep 6

          # 01 — Home tab (default landing screen; sidebar starts focused here)
          xcrun simctl io booted screenshot screenshots/01_Home.png
          echo "Captured Home -> screenshots/01_Home.png"

          # Sidebar order (tvOS .sidebarAdaptable, top-to-bottom):
          #   Search  ← one up from Home
          #   Home    ← selected on launch
          #   Series  ← one down
          #   Movies  ← two down
          #   Collections ← three down
          #   Settings    ← four down

          # 02 — Search (press menu to refocus sidebar, then up from Home)
          sidebar_nav "up"   "Search"      screenshots/02_Search.png

          # Return to Home before continuing downward
          xcrun simctl io booted sendkey menu 2>/dev/null || true
          sleep 0.5
          xcrun simctl io booted sendkey down 2>/dev/null || true
          sleep 0.5
          xcrun simctl io booted sendkey select 2>/dev/null || true
          sleep 2  # brief re-centre, no screenshot needed

          # 03 — Series (one down from Home)
          sidebar_nav "down" "Series"      screenshots/03_Series.png

          # 04 — Movies (one more down from Series)
          sidebar_nav "down" "Movies"      screenshots/04_Movies.png

          # 05 — Collections (one more down from Movies)
          sidebar_nav "down" "Collections" screenshots/05_Collections.png

          # 06 — Settings (one more down from Collections)
          sidebar_nav "down" "Settings"    screenshots/06_Settings.png

          echo "All screenshots captured:"
          ls -lh screenshots/

      - name: Upload screenshots as artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraTV-Screenshots
          path: screenshots/
          if-no-files-found: error
          retention-days: 30
