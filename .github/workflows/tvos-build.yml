name: tvOS Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build AuraTV (tvOS)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Xcode environment & schemes
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          xcodebuild -project AuraTV.xcodeproj -list

      - name: Resolve Swift Package Manager dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project AuraTV.xcodeproj \
            -scheme AuraTV \
            -destination 'generic/platform=tvOS'

      - name: Build AuraTV for tvOS
        run: |
          xcodebuild build \
            -project AuraTV.xcodeproj \
            -scheme AuraTV \
            -destination 'generic/platform=tvOS' \
            CODE_SIGNING_ALLOWED=NO

  screenshots:
    name: Simulator Screenshots (tvOS)
    runs-on: macos-15
    timeout-minutes: 45
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Swift Package Manager dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project AuraTV.xcodeproj \
            -scheme AuraTV \
            -destination 'platform=tvOS Simulator,name=Apple TV 4K (3rd generation)'

      - name: Build AuraTV for tvOS Simulator
        run: |
          xcodebuild build \
            -project AuraTV.xcodeproj \
            -scheme AuraTV \
            -destination 'platform=tvOS Simulator,name=Apple TV 4K (3rd generation)' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Find simulator runtime & boot Apple TV 4K
        run: |
          # List available tvOS simulator runtimes
          xcrun simctl list runtimes
          xcrun simctl list devices

          # Pick the first available Apple TV 4K simulator device
          DEVICE_UDID=$(xcrun simctl list devices available -j \
            | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          for runtime, devices in d['devices'].items():
              if 'tvOS' not in runtime:
                  continue
              for dev in devices:
                  if 'Apple TV 4K' in dev['name'] and dev['isAvailable']:
                      print(dev['udid'])
                      exit()
          " 2>/dev/null || echo "")

          if [ -z "$DEVICE_UDID" ]; then
            # Create one if none found
            RUNTIME=$(xcrun simctl list runtimes -j \
              | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          for r in reversed(d['runtimes']):
              if 'tvOS' in r.get('name','') and r.get('isAvailable', False):
                  print(r['identifier'])
                  exit()
          ")
            echo "Creating Apple TV 4K simulator on runtime $RUNTIME"
            DEVICE_UDID=$(xcrun simctl create 'AuraTV-CI-TV' \
              'com.apple.CoreSimulator.SimDeviceType.Apple-TV-4K-3rd-generation-4K' \
              "$RUNTIME")
          fi

          echo "Using simulator UDID: $DEVICE_UDID"
          echo "DEVICE_UDID=$DEVICE_UDID" >> $GITHUB_ENV

          # Boot the simulator
          xcrun simctl boot "$DEVICE_UDID" || true
          # Wait until booted
          until xcrun simctl list devices | grep "$DEVICE_UDID" | grep -q Booted; do
            echo "Waiting for simulator to boot..."
            sleep 3
          done
          echo "Simulator booted."

      - name: Locate built .app bundle
        run: |
          APP_PATH=$(find build/DerivedData -name 'AuraTV.app' \
            -path '*iphonesimulator*' -o \
            -name 'AuraTV.app' -path '*appletvsimulator*' \
            | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build/DerivedData -name 'AuraTV.app' | head -n 1)
          fi
          echo "App bundle: $APP_PATH"
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV

      - name: Install AuraTV on simulator
        run: |
          xcrun simctl install "$DEVICE_UDID" "$APP_PATH"

      - name: Launch AuraTV and capture screenshots
        run: |
          mkdir -p screenshots

          # Get the app's bundle ID from Info.plist
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist")
          echo "Bundle ID: $BUNDLE_ID"

          # ----------------------------------------------------------------
          # Deterministic tab-by-tab screenshot strategy
          #
          # We terminate and relaunch the app for each tab using the
          # `-screenshotTab <name>` launch argument, which ContentView reads
          # from ProcessInfo.processInfo.arguments and sets as the initial tab.
          # This avoids all sendkey / remote navigation unreliability.
          #
          # For each tab we:
          #   1. Terminate any running instance
          #   2. Launch with --console-pty so TMDB log lines appear in CI output
          #   3. Sleep to allow SwiftData init + TMDB network fetch + AsyncImage decode
          #   4. Capture screenshot
          #   5. Print the last 60 lines of app logs to confirm TMDB loaded data
          # ----------------------------------------------------------------

          capture_tab() {
            local tab_name="$1"     # matches AppTab.rawValue (e.g. "Home")
            local out_file="$2"
            local wait_secs="${3:-9}"  # default 9s for TMDB + AsyncImage

            echo ""
            echo "=== Capturing tab: $tab_name ==="

            # Terminate existing instance (ignore error if not running)
            xcrun simctl terminate "$DEVICE_UDID" "$BUNDLE_ID" 2>/dev/null || true
            sleep 1

            # Launch app onto the target tab, capturing stdout/stderr
            xcrun simctl launch \
              --console-pty \
              "$DEVICE_UDID" \
              "$BUNDLE_ID" \
              -screenshotTab "$tab_name" \
              2>&1 | head -5 || true

            # Wait for SwiftData bootstrap + TMDB fetch + AsyncImage rendering
            sleep "$wait_secs"

            # Grab the screenshot
            xcrun simctl io "$DEVICE_UDID" screenshot "$out_file"
            echo "Wrote screenshot: $out_file ($(du -h "$out_file" | cut -f1))"

            # Tail app console log for TMDB diagnostics (last 30 lines)
            echo "--- app log tail for $tab_name ---"
            xcrun simctl spawn "$DEVICE_UDID" log show \
              --predicate 'process == "AuraTV"' \
              --style compact \
              --last 30s \
              2>/dev/null | tail -40 || true
            echo "--- end log tail ---"
          }

          # Warm up: launch once onto Home so SwiftData & TMDB are primed
          # and the second Home screenshot has fully-loaded posters.
          echo "=== Warm-up launch (Home) ==="
          xcrun simctl launch --console-pty "$DEVICE_UDID" "$BUNDLE_ID" \
            -screenshotTab Home 2>&1 | head -3 || true
          sleep 12   # generous: SwiftData cold start + TMDB trending fetch + AsyncImage

          xcrun simctl io "$DEVICE_UDID" screenshot screenshots/01_Home.png
          echo "Wrote screenshot: 01_Home.png ($(du -h screenshots/01_Home.png | cut -f1))"
          echo "--- app log (Home warm-up) ---"
          xcrun simctl spawn "$DEVICE_UDID" log show \
            --predicate 'process == "AuraTV"' \
            --style compact \
            --last 15s \
            2>/dev/null | tail -60 || true
          echo "--- end log ---"

          # Capture each remaining tab (terminate+relaunch per tab)
          capture_tab "Search"      screenshots/02_Search.png      7
          capture_tab "Series"      screenshots/03_Series.png      9
          capture_tab "Movies"      screenshots/04_Movies.png      9
          capture_tab "Collections" screenshots/05_Collections.png 7
          capture_tab "Settings"    screenshots/06_Settings.png    5

          echo ""
          echo "=== All screenshots ==="
          ls -lh screenshots/

      - name: Upload screenshots as artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraTV-Screenshots
          path: screenshots/
          if-no-files-found: error
          retention-days: 30
